<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png"/>
<title>Evaluador de plan de escalado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#111113;
    --card:#1A1A1D;
    --card-hover:#1F2022;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --text:#F2F2F3;
    --text-2:#9B9B9F;
    --text-3:#6C6C71;
    --accent:#6FA8FF;
    --accent-soft:rgba(111,168,255,0.12);
    --good:#4ADE95;
    --good-soft:rgba(74,222,149,0.12);
    --bad:#FF6B6B;
    --bad-soft:rgba(255,107,107,0.12);
    --warn:#F5B85A;
    --warn-soft:rgba(245,184,90,0.12);
  }
  *{box-sizing:border-box;}
  :root{ --ease:cubic-bezier(0.16,1,0.3,1); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  @keyframes floatIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(0.9); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes draw{
    to{ stroke-dashoffset:0; }
  }
  .anim{ opacity:0; animation:floatIn 0.55s var(--ease) forwards; }
  .icon-draw{
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:draw 0.5s var(--ease) forwards;
    animation-delay:0.25s;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:72px 24px 100px;
  }
  .eyebrow{
    display:flex; align-items:center; gap:8px;
    font-size:13px;
    color:var(--accent);
    font-weight:500;
    margin:0 0 18px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--good);
  }
  h1{
    font-weight:700;
    font-size:29px;
    line-height:1.25;
    letter-spacing:-0.02em;
    margin:0 0 12px;
    color:#fff;
  }
  .subtitle{
    color:var(--text-2);
    font-size:15px;
    line-height:1.6;
    max-width:44ch;
    margin:0 0 36px;
  }

  .drop{
    border:1px solid var(--border);
    border-radius:20px;
    padding:44px 24px;
    text-align:center;
    cursor:pointer;
    background:var(--card);
    transition:border-color 0.25s var(--ease), background 0.25s var(--ease), transform 0.25s var(--ease);
  }
  .drop:hover{ background:var(--card-hover); transform:translateY(-2px); }
  .drop.hover{ border-color:var(--accent); background:var(--accent-soft); transform:scale(0.98); }

  .drop-glyph{
    width:44px; height:44px;
    margin:0 auto 16px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-size:18px;
    transition:transform 0.3s var(--ease);
  }
  .drop.hover .drop-glyph{ transform:translateY(3px) scale(1.08); }
  .drop-title{
    font-size:16px;
    font-weight:600;
    margin:0 0 5px;
    color:#fff;
  }
  .drop-sub{
    font-size:13.5px;
    color:var(--text-2);
  }
  .drop-sub button{
    background:none; border:none; padding:0;
    font:inherit; color:var(--accent);
    cursor:pointer;
    font-weight:500;
  }
  .drop-sub button:hover{ text-decoration:underline; }
  input[type=file]{display:none;}

  .filebar{
    display:none;
    align-items:center; justify-content:space-between;
    margin-top:12px; padding:11px 18px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    font-size:13.5px;
  }
  .filebar .name{ color:var(--text); font-weight:500; }
  .filebar button{
    background:none; border:none; color:var(--text-2); cursor:pointer; font-size:13px;
  }
  .filebar button:hover{ color:var(--bad); }

  #error{
    display:none; margin-top:14px; padding:14px 18px;
    background:var(--bad-soft);
    border:1px solid rgba(255,107,107,0.25);
    border-radius:14px;
    color:#FF9B9B;
    font-size:13.5px; line-height:1.6;
  }

  #results{ display:none; margin-top:40px; }

  .verdict{
    display:flex; align-items:center; gap:14px;
    padding:22px 24px;
    border-radius:20px;
    margin-bottom:28px;
    border:1px solid;
  }
  .verdict.ok{ background:var(--good-soft); border-color:rgba(74,222,149,0.25); }
  .verdict.no{ background:var(--bad-soft); border-color:rgba(255,107,107,0.25); }
  .verdict.pending{ background:var(--warn-soft); border-color:rgba(245,184,90,0.3); }
  .verdict-badge{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .verdict-badge.ok{ background:var(--good); color:#0B1F14; }
  .verdict-badge.no{ background:var(--bad); color:#2A0A0A; }
  .verdict-badge.pending{ background:var(--warn); color:#2A1D05; font-size:14px; font-weight:700; }
  .verdict-word{
    font-weight:700;
    font-size:19px;
  }
  .verdict-word.ok{ color:var(--good); }
  .verdict-word.no{ color:var(--bad); }
  .verdict-word.pending{ color:var(--warn); }
  .verdict-sub{
    font-size:13px; color:var(--text-2);
    margin-top:2px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:6px 20px;
    margin-bottom:24px;
    transition:border-color 0.25s var(--ease);
  }
  .card:hover{ border-color:var(--border-strong); }
  .req{
    display:flex; gap:14px;
    align-items:flex-start;
    padding:16px 0;
  }
  .req:not(:last-child){ border-bottom:1px solid var(--border); }
  .req-mark{
    flex:none; width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700;
    margin-top:1px;
    animation:popIn 0.4s var(--ease) forwards;
  }
  .req-mark.ok{ background:var(--good-soft); color:var(--good); }
  .req-mark.no{ background:var(--bad-soft); color:var(--bad); }
  .req-title{
    font-weight:600; font-size:14.5px; margin-bottom:3px; color:#fff;
  }
  .req-detail{
    font-size:13px; color:var(--text-2);
  }

  .section-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--text-2);
    margin:0 0 10px 2px;
  }

  table{
    width:100%; border-collapse:collapse;
    font-size:13.5px;
  }
  th{
    text-align:left; font-weight:500;
    color:var(--text-3);
    font-size:12px;
    padding:10px 4px;
  }
  td{ padding:11px 4px; color:var(--text); }
  tr:not(:last-child) td{ border-bottom:1px solid var(--border); }
  td.num, th.num{ text-align:right; }
  .pos{ color:var(--good); font-weight:500; }
  .neg{ color:var(--bad); font-weight:500; }
  .muted{ color:var(--text-3); }
  .warn-text{ color:var(--warn); font-weight:500; }

  details.mes-detail summary{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    gap:8px;
  }
  details.mes-detail summary::-webkit-details-marker{ display:none; }
  details.mes-detail summary .chev{
    color:var(--text-3);
    font-size:11px;
    transition:transform 0.2s var(--ease);
    flex:none;
  }
  details.mes-detail[open] summary .chev{ transform:rotate(90deg); }
  .sub-table{
    padding:2px 0 10px 20px;
    font-size:12.5px;
  }
  .sub-table .sub-row{
    display:flex; justify-content:space-between;
    padding:5px 0;
    color:var(--text-2);
    border-bottom:1px solid var(--border);
  }
  .sub-table .sub-row:last-child{ border-bottom:none; }

  .integrity{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px;
    color:var(--text-2);
    margin-bottom:20px;
  }
  .integrity .chip{
    width:7px; height:7px; border-radius:50%;
  }
  .integrity .chip.ok{ background:var(--good); }
  .integrity .chip.warn{ background:var(--warn); }

  .foot-note{
    margin-top:32px;
    font-size:12.5px; color:var(--text-3);
    line-height:1.7;
  }

  ::selection{ background:var(--accent-soft); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow"><span class="dot"></span>Evaluador local · plan de escalado</p>
  <h1>¿Tu cuenta califica?</h1>
  <p class="subtitle">Soltá el ReportHistory (.xlsx) exportado desde MT4/MT5 y revisá al instante si el ciclo cumple los tres requisitos.</p>

  <div class="drop" id="drop">
    <div class="drop-glyph">↓</div>
    <p class="drop-title">Arrastrá el archivo acá</p>
    <p class="drop-sub">o <button type="button" id="browseBtn">elegilo desde tu equipo</button></p>
    <input type="file" id="fileInput" accept=".xlsx">
  </div>

  <div class="filebar" id="filebar">
    <span class="name" id="filename"></span>
    <button id="clearBtn">quitar</button>
  </div>

  <div id="error"></div>
  <div id="results"></div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const browseBtn = document.getElementById('browseBtn');
const filebar = document.getElementById('filebar');
const filenameEl = document.getElementById('filename');
const clearBtn = document.getElementById('clearBtn');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');

const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

drop.addEventListener('click', () => fileInput.click());
browseBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });

['dragenter','dragover'].forEach(evt => {
  drop.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.add('hover'); });
});
['dragleave','drop'].forEach(evt => {
  drop.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('hover'); });
});
drop.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) handleFile(f);
});
clearBtn.addEventListener('click', () => {
  fileInput.value = '';
  filebar.style.display = 'none';
  resultsEl.style.display = 'none';
  errorEl.style.display = 'none';
});

function mostrarError(msg){
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  errorEl.classList.remove('anim'); void errorEl.offsetWidth; errorEl.classList.add('anim');
  resultsEl.style.display = 'none';
}

function handleFile(file){
  errorEl.style.display = 'none';
  filenameEl.textContent = file.name;
  filebar.style.display = 'flex';
  filebar.classList.remove('anim'); void filebar.offsetWidth; filebar.classList.add('anim');

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true, blankrows: true });
      const res = evaluarEscalado(rows);
      renderResultados(res);
    } catch (err) {
      console.error(err);
      mostrarError('No se pudo leer el archivo. Verificá que sea un ReportHistory (.xlsx) exportado desde MT4/MT5, con las secciones Positions, Orders y Deals. Detalle: ' + err.message);
    }
  };
  reader.onerror = () => mostrarError('No se pudo leer el archivo desde el navegador.');
  reader.readAsArrayBuffer(file);
}

function parseFecha(valor){
  if (valor instanceof Date) return valor;
  if (typeof valor === 'string') {
    const m = valor.trim().match(/^(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
    if (m) {
      const [, y, mo, d, h, mi, s] = m.map(Number);
      return new Date(y, mo - 1, d, h, mi, s);
    }
  }
  return null;
}

function addMonthsClamped(date, months){
  const day = date.getDate();
  const target = new Date(date.getFullYear(), date.getMonth() + months, 1, date.getHours(), date.getMinutes(), date.getSeconds());
  const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(day, lastDay));
  return target;
}

function mesesDelCiclo(inicio, n){
  const meses = [];
  for (let i = 0; i < n; i++){
    const d = new Date(inicio.getFullYear(), inicio.getMonth() + i, 1);
    meses.push({ year: d.getFullYear(), month: d.getMonth() + 1, key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') });
  }
  return meses;
}

function buscarTotalTradesFooter(rows, desde){
  for (let i = desde; i < rows.length; i++){
    const row = rows[i];
    if (!row) continue;
    if (row[0] === 'Total Trades:'){
      const num = row.find((v, idx) => idx > 0 && typeof v === 'number');
      return typeof num === 'number' ? num : null;
    }
  }
  return null;
}

function evaluarEscalado(rows){
  const idxDeals = rows.findIndex(r => r && r[0] === 'Deals');
  if (idxDeals === -1) {
    throw new Error("no se encontró la sección 'Deals' en el archivo");
  }
  const headers = rows[idxDeals + 1].map(h => (h || '').toString().trim());
  const col = (name) => headers.indexOf(name);
  const cTime = col('Time'), cType = col('Type'), cComment = col('Comment'), cProfit = col('Profit'), cBalance = col('Balance'), cSymbol = col('Symbol'), cDirection = col('Direction');

  const deals = [];
  let finDeals = idxDeals + 2;
  for (let i = idxDeals + 2; i < rows.length; i++){
    const row = rows[i];
    if (!row) { finDeals = i; break; }
    const fecha = parseFecha(row[cTime]);
    if (!fecha) { finDeals = i; break; }
    deals.push({
      time: fecha,
      type: (row[cType] || '').toString().toLowerCase(),
      direction: (row[cDirection] || '').toString().toLowerCase(),
      symbol: (row[cSymbol] || '').toString(),
      comment: (row[cComment] || '').toString().toLowerCase(),
      profit: Math.round((Number(row[cProfit]) || 0) * 100) / 100,
      balance: Number(row[cBalance])
    });
    finDeals = i + 1;
  }
  if (deals.length === 0) throw new Error('no se encontraron operaciones (Deals) en el archivo');

  const creacion = deals.find(d => d.type === 'balance' && d.comment.includes('create'));
  const inicio = creacion ? creacion.time : deals[0].time;
  const balanceInicial = creacion ? creacion.balance : (deals[0].balance - deals[0].profit);
  const finCiclo = addMonthsClamped(inicio, 3);
  const hoy = new Date();
  const cicloFinalizado = hoy >= finCiclo;

  const retiros = deals.filter(d => d.type === 'balance' && d.comment.includes('withdrawal'));
  const retirosCiclo = retiros.filter(d => d.time >= inicio && d.time < finCiclo);

  const trades = deals.filter(d => d.type !== 'balance');
  const tradesCiclo = trades.filter(d => d.time >= inicio && d.time < finCiclo);

  // --- control de integridad: cotejar cierres detectados contra el resumen del broker ---
  const cierresDetectados = trades.filter(d => d.direction === 'out').length;
  const totalTradesFooter = buscarTotalTradesFooter(rows, finDeals);
  const integridadOk = totalTradesFooter === null || totalTradesFooter === cierresDetectados;

  // --- meses del ciclo: siempre los 3, aunque alguno no tenga operaciones ---
  const claveHoy = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
  const meses = mesesDelCiclo(inicio, 3).map(m => {
    const tradesMes = tradesCiclo.filter(d => (d.time.getFullYear() + '-' + String(d.time.getMonth() + 1).padStart(2, '0')) === m.key);
    const resultado = Math.round(tradesMes.reduce((acc, d) => acc + d.profit, 0) * 100) / 100;
    let estado;
    if (m.key === claveHoy && !cicloFinalizado) estado = 'en_curso';
    else if (tradesMes.length === 0) estado = 'sin_operaciones';
    else if (resultado > 0) estado = 'positivo';
    else estado = 'negativo';
    return { ...m, resultado, estado, trades: tradesMes };
  });

  const mesesPositivos = meses.filter(m => m.estado === 'positivo').length;
  const cumpleMeses = mesesPositivos >= 2;

  const profitTotal = Math.round(tradesCiclo.reduce((acc, d) => acc + d.profit, 0) * 100) / 100;
  const retornoPct = balanceInicial ? (profitTotal / balanceInicial) * 100 : 0;
  const cumpleRetorno = retornoPct >= 15;

  const cumpleRetiros = retirosCiclo.length >= 3;
  const calificado = cumpleRetorno && cumpleMeses && cumpleRetiros;

  return {
    balanceInicial, inicio, finCiclo, cicloFinalizado,
    meses, mesesPositivos, cumpleMeses,
    profitTotal, retornoPct, cumpleRetorno,
    retirosCiclo, cumpleRetiros,
    calificado,
    integridadOk, cierresDetectados, totalTradesFooter
  };
}

function fmtMoney(n){
  return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtFecha(d){
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function mesLabel(key){
  const [y, m] = key.split('-');
  return MESES_ES[parseInt(m, 10) - 1] + ' ' + y;
}

function svgCheck(){
  return `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="icon-draw" d="M5 13l4 4L19 7"/></svg>`;
}
function svgCross(){
  return `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="icon-draw" d="M6 6L18 18M18 6L6 18"/></svg>`;
}

function renderResultados(res){
  const ESTADO_LABEL = { positivo: 'positivo', negativo: 'negativo', sin_operaciones: 'sin operaciones', en_curso: 'en curso' };
  const ESTADO_CLASE = { positivo: 'pos', negativo: 'neg', sin_operaciones: 'muted', en_curso: 'warn-text' };

  const filas = res.meses.map(m => {
    const cls = ESTADO_CLASE[m.estado];
    const filasTrades = m.trades.map(d =>
      `<div class="sub-row"><span>${fmtFecha(d.time)} · ${d.symbol || d.type}</span><span class="${d.profit > 0 ? 'pos' : (d.profit < 0 ? 'neg' : 'muted')}">${fmtMoney(d.profit)}</span></div>`
    ).join('') || `<div class="sub-row muted">sin operaciones cerradas este mes</div>`;

    return `<tr>
      <td colspan="3" style="padding:0;">
        <details class="mes-detail">
          <summary style="padding:9px 0;">
            <span class="chev">▸</span>
            <span style="flex:1;">${mesLabel(m.key)}</span>
            <span class="num ${cls}" style="width:110px;">${fmtMoney(m.resultado)}</span>
            <span class="num ${cls}" style="width:110px;">${ESTADO_LABEL[m.estado]}</span>
          </summary>
          <div class="sub-table">${filasTrades}</div>
        </details>
      </td>
    </tr>`;
  }).join('');

  const filasRetiros = res.retirosCiclo.map(d =>
    `<tr><td>${fmtFecha(d.time)}</td><td class="num neg">${fmtMoney(d.profit)}</td><td class="muted">${d.comment}</td></tr>`
  ).join('') || `<tr><td colspan="3" class="muted">Sin retiros en el ciclo</td></tr>`;

  const veredictoClase = !res.cicloFinalizado ? 'pending' : (res.calificado ? 'ok' : 'no');
  const veredictoTexto = !res.cicloFinalizado ? 'En curso' : (res.calificado ? 'Califica' : 'No califica');
  const veredictoIcono = !res.cicloFinalizado ? '···' : (res.calificado ? svgCheck() : svgCross());
  const veredictoSub = !res.cicloFinalizado
    ? `Ciclo aún no finaliza (${fmtFecha(res.finCiclo)}) — resultado parcial con los datos disponibles`
    : `Ciclo ${fmtFecha(res.inicio)} — ${fmtFecha(res.finCiclo)}`;

  const integridadHtml = res.totalTradesFooter === null
    ? ''
    : `<div class="integrity"><span class="chip ${res.integridadOk ? 'ok' : 'warn'}"></span>${res.integridadOk
        ? `Datos verificados: ${res.cierresDetectados}/${res.totalTradesFooter} operaciones coinciden con el resumen del broker`
        : `Atención: se detectaron ${res.cierresDetectados} cierres, pero el resumen del broker indica ${res.totalTradesFooter} — revisá el archivo`}</div>`;

  resultsEl.innerHTML = `
    ${integridadHtml}

    <div class="verdict anim ${veredictoClase}" style="animation-delay:0.05s">
      <div class="verdict-badge ${veredictoClase}">${veredictoIcono}</div>
      <div>
        <div class="verdict-word ${veredictoClase}">${veredictoTexto}</div>
        <div class="verdict-sub">${veredictoSub}</div>
      </div>
    </div>

    <div class="card anim" style="animation-delay:0.15s">
      <div class="req">
        <div class="req-mark ${res.cumpleRetorno ? 'ok' : 'no'}" style="animation-delay:0.4s">${res.cumpleRetorno ? svgCheck() : svgCross()}</div>
        <div>
          <div class="req-title">Retorno del 15% en el ciclo</div>
          <div class="req-detail">${fmtMoney(res.profitTotal)} / ${fmtMoney(res.balanceInicial)} = ${res.retornoPct.toFixed(2)}%</div>
        </div>
      </div>
      <div class="req">
        <div class="req-mark ${res.cumpleMeses ? 'ok' : 'no'}" style="animation-delay:0.48s">${res.cumpleMeses ? svgCheck() : svgCross()}</div>
        <div>
          <div class="req-title">Al menos 2 de 3 meses en positivo</div>
          <div class="req-detail">${res.mesesPositivos} de 3 meses positivos</div>
        </div>
      </div>
      <div class="req">
        <div class="req-mark ${res.cumpleRetiros ? 'ok' : 'no'}" style="animation-delay:0.56s">${res.cumpleRetiros ? svgCheck() : svgCross()}</div>
        <div>
          <div class="req-title">Al menos 3 solicitudes de recompensa</div>
          <div class="req-detail">${res.retirosCiclo.length} retiro(s) detectado(s)</div>
        </div>
      </div>
    </div>

    <p class="section-label anim" style="animation-delay:0.25s">Resultado mensual <span class="muted" style="font-weight:400;">— tocá un mes para ver el detalle</span></p>
    <div class="card anim" style="animation-delay:0.28s">
      <div style="display:flex; padding:10px 0 4px; border-bottom:1px solid var(--border-strong); font-size:12px; color:var(--text-3);">
        <span style="flex:1;">Mes</span>
        <span style="width:110px; text-align:right;">Resultado</span>
        <span style="width:110px; text-align:right;">Estado</span>
      </div>
      <table>
        ${filas}
      </table>
    </div>

    <p class="section-label anim" style="animation-delay:0.35s">Retiros del ciclo</p>
    <div class="card anim" style="animation-delay:0.38s">
      <table>
        <tr><th>Fecha</th><th class="num">Monto</th><th>Comentario</th></tr>
        ${filasRetiros}
      </table>
    </div>

    <p class="foot-note anim" style="animation-delay:0.45s">Cálculo agrupado por mes calendario sobre la sección "Deals" del reporte. El retorno usa el profit total de trading del ciclo, sin descontar retiros ya realizados. Un mes sin operaciones cerradas no cuenta como positivo.</p>
  `;
  resultsEl.style.display = 'block';
}
</script>
</body>
</html>
